name: Verify package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [docker, podman]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check syntax and configuration
        run: |
          bash -n sonar
          bash -n skills/codex/sq/scripts/doctor.sh skills/codex/sq/scripts/project-name.sh
          bash -n skills/copilot/sq/scripts/doctor.sh skills/copilot/sq/scripts/project-name.sh
          docker compose --profile tools config --quiet
          docker compose -f compose.yaml -f compose.podman.yaml --profile tools config --quiet
          SONAR_EXTERNAL_SOURCE_PATH="$PWD/tests/fixtures/python" SONAR_STATE_PATH="$PWD/.state" SONAR_PROJECTS_PATH="$PWD/.state/empty-projects" docker compose -f compose.yaml -f compose.external.yaml --profile tools config --quiet
          SONAR_EXTERNAL_SOURCE_PATH="$PWD/tests/fixtures/python" SONAR_STATE_PATH="$PWD/.state/podman" SONAR_PROJECTS_PATH="$PWD/.state/podman/empty-projects" docker compose -f compose.yaml -f compose.podman.yaml -f compose.external.yaml --profile tools config --quiet
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Configure Elasticsearch prerequisites on the test runner
        run: |
          sudo sysctl -w vm.max_map_count=524288
          sudo sysctl -w fs.file-max=131072
      - name: Install Podman and Compose provider
        if: matrix.engine == 'podman'
        run: |
          sudo apt-get update
          sudo apt-get install -y podman podman-compose
      - name: Run native Linux AMD64 Docker smoke suite
        if: matrix.engine == 'docker'
        run: python3 tests/smoke.py
      - name: Run native Linux AMD64 Podman smoke suite
        if: matrix.engine == 'podman'
        run: sudo env PODMAN_COMPOSE_PROVIDER=/usr/bin/podman-compose python3 tests/smoke.py --engine podman
