# Copy to config/projects/<folder-name>.properties, then replace BOTH sample
# directory names with the themes/plugins your team owns. Remove unused entries.
# Explicit source paths avoid analyzing WordPress core and third-party packages.
sonar.sources=wp-content/themes/YOUR_THEME,wp-content/plugins/YOUR_PLUGIN

# For a repository containing only one custom theme or plugin, use instead:
# sonar.sources=.

# Optional paths, when present in your repository:
# sonar.tests=tests
# sonar.php.version=8.3
# sonar.php.coverage.reportPaths=coverage/clover.xml
# sonar.php.tests.reportPath=coverage/junit.xml
