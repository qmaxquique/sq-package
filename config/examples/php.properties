# Copy to config/projects/<folder-name>.properties and adjust to your repository.
# Paths are relative to the cloned repository, not to this configuration file.
sonar.sources=.

# Use these when the directories exist. The package excludes test directories
# from the source set automatically when sonar.tests is configured.
# sonar.sources=src
# sonar.tests=tests
# sonar.php.version=8.3

# Reports must already exist; the package does not run PHPUnit.
# sonar.php.coverage.reportPaths=coverage/clover.xml
# sonar.php.tests.reportPath=coverage/junit.xml

# An override replaces the default exclusions. Retain the defaults you need.
# The full current default list is in config/defaults.properties.
# To analyze only PHP in a mixed repository, set sonar.inclusions explicitly:
# sonar.inclusions=**/*.php,**/*.php3,**/*.php4,**/*.php5,**/*.phtml,**/*.inc,**/php.ini
