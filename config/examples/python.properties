# Copy to config/projects/<folder-name>.properties and adjust to your repository.
# Paths are relative to the cloned repository, not to this configuration file.
sonar.sources=.

# Recommended: specify the Python versions supported by this application.
# Comma-separated versions are supported, for example 3.11,3.12.
# sonar.python.version=3.12

# Enable only when these directories exist. Test files are then excluded from
# the production source set automatically. Tests are not run by this package.
# sonar.sources=src
# sonar.tests=tests

# Generate reports in your existing Python environment before scanning.
# Coverage.py / pytest-cov: Cobertura XML. pytest: xUnit XML (junit_family=xunit1
# retains test file paths so SonarQube can map results to the test sources).
# Use explicit report file paths; package validation does not expand wildcards.
# sonar.python.coverage.reportPaths=coverage/coverage.xml
# sonar.python.xunit.reportPath=coverage/junit.xml

# To restrict a mixed repository to Python, enable this override:
# sonar.inclusions=**/*.py

# Virtual environments named .venv or venv, site-packages, Python tool caches,
# and *.egg-info directories are excluded by default. For another environment
# name, append its path to the defaults rather than scanning its dependencies.
